name: Sync Strava
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/sync_strava.py
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      - run: node scripts/make_csv.js
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data.js timeline.csv && (git diff --cached --quiet || git commit -m "sync strava" && git push)
