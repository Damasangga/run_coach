<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run Coach — Road to Marathon</title>
<style>
:root{--bg:#f3f5ff;--cd:#fff;--tx:#1b2430;--mu:#68738a;--ac:#365cf5;--wa:#f08a24;--line:#e6e9f2;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#101522;--cd:#1a2233;--tx:#eef2ff;--mu:#a4aec4;--ac:#7794ff;--wa:#ffb454;--line:#30394d;color-scheme:dark}}
*{box-sizing:border-box}body{min-height:100vh;margin:0;font:16px/1.55 system-ui,sans-serif;background:radial-gradient(ellipse at 10% 0%,rgba(113,131,255,.12),transparent 36%),var(--bg);color:var(--tx)}
header{padding:24px clamp(18px,4vw,64px) 16px;display:flex;justify-content:space-between;align-items:center;gap:18px}h1{margin:0;font-size:clamp(1.35rem,2vw,2rem);letter-spacing:-.04em}header .mu{margin:2px 0 0}
main{width:100%;padding:12px clamp(18px,4vw,64px) 72px}section{width:100%}
nav{position:sticky;z-index:5;top:0;display:flex;gap:8px;padding:10px clamp(18px,4vw,64px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-block:1px solid var(--line)}
nav button{flex:1;padding:11px 16px;border:1px solid var(--line);border-radius:12px;background:var(--cd);color:var(--tx);font:inherit;font-weight:650;cursor:pointer;transition:transform .18s,background .18s}nav button:hover{transform:translateY(-1px)}nav .on{background:linear-gradient(120deg,var(--ac),#9059e9);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(54,92,245,.25)}
.card{background:var(--cd);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2vw,24px);margin:12px 0;box-shadow:0 8px 28px rgba(30,43,80,.055)}.card h3{margin:0 0 8px;font-size:.83rem;color:var(--mu);text-transform:uppercase;letter-spacing:.07em}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}.g .card{margin:0}.mu{color:var(--mu);font-size:.92rem}svg{display:block;width:100%;height:auto}
button{font:inherit}.card button{margin:6px 8px 0 0;padding:10px 15px;border:0;border-radius:10px;background:linear-gradient(120deg,var(--ac),#7858ec);color:#fff;font-weight:650;cursor:pointer;box-shadow:0 4px 12px rgba(54,92,245,.18)}.card button:hover{filter:brightness(1.08)}
details{background:var(--cd);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin:12px 0;box-shadow:0 5px 20px rgba(30,43,80,.04)}summary{cursor:pointer;font-weight:700;padding:4px}details[open] summary{color:var(--ac)}details .card{background:var(--bg)}
.ic{font-size:2rem}.lock{opacity:.65}.pb{height:9px;background:var(--bg);border-radius:8px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,#35c5a1,#6384ff,#a759ee);border-radius:inherit}.hero{display:flex;justify-content:space-between;align-items:center;gap:24px;min-height:200px;padding:clamp(24px,4vw,48px);border-radius:26px;color:#fff;background:linear-gradient(118deg,#365cf5 0%,#7458ed 52%,#e14caa 100%);margin:4px 0 16px;box-shadow:0 18px 42px rgba(75,76,210,.25);overflow:hidden}.hero svg{width:84px;flex:0 0 84px}.hero h2{margin:4px 0;font-size:clamp(2rem,4.5vw,4rem);line-height:1.05;letter-spacing:-.05em}.hero p{margin:5px 0}.mu2{opacity:.86;font-size:.9rem}
.kp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:14px 0}.kp .card{margin:0;text-align:left;position:relative;overflow:hidden}.kp .card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--ac)}.kp .card:nth-child(2):before{background:#9b59e8}.kp .card:nth-child(3):before{background:#f08a24}.kp .card:nth-child(4):before{background:#22b88a}.kp span{font-size:.82rem;color:var(--mu)}.kp b{display:block;font-size:clamp(1.45rem,2.4vw,2.25rem);letter-spacing:-.04em}.kp small{font-size:.78rem;color:var(--mu);font-weight:500;letter-spacing:0}
.coach{border-left:4px solid #8b5cf6}.s-done{border-left:4px solid #2faa6e}.s-miss{border-left:4px solid #ef4444}.s-part{border-left:4px solid var(--wa)}.gold{background:linear-gradient(135deg,#fff3c4,#ffd86b);color:#3a2a00}.gold .mu{color:#6b5200}
@media(max-width:720px){header{align-items:flex-start;flex-direction:column}main{padding-top:8px}.kp{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hero{min-height:160px}.hero svg{width:70px;flex-basis:70px}}
@media(max-width:420px){nav{gap:5px;padding-inline:10px}nav button{padding:9px 5px;font-size:.9rem}main{padding-inline:12px}.kp{gap:8px}.kp .card{padding:14px 12px}.hero{gap:8px;padding:20px}}
</style></head><body>
<header><h1>🏃 Road to Marathon</h1><div class="mu">Target 13 Juni 2027 · bikin tiap lari terasa menang kecil</div></header>
<nav><button class="on" data-t="dash">Dashboard</button><button data-t="tl">Timeline</button><button data-t="ach">Achievement</button></nav>
<main><section id="dash"></section><section id="tl" hidden></section><section id="ach" hidden></section></main>
<script src="data.js"></script><script src="plan.js"></script><script src="app.js"></script></body></html>
